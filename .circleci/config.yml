# POD Verifier — CI/CD for the container Lambda (aws/lambda_scorer).
#
# Mirrors aws/DEPLOYMENT.md: plain Docker + AWS CLI + CloudFormation (no SAM/CDK).
#   build-and-test  → docker buildx (DRY_RUN=true ./deploy.sh) + pytest inside the image
#   deploy          → ./deploy.sh (ECR login → push → lambda update-function-code)
#   provision-stack → ./provision-stack.sh (aws cloudformation deploy), manual-gated
#
# Required CircleCI context "pod-verifier-aws":
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY   (ECR/Lambda/CFN/IAM permissions)
# Required only for the provision-stack job (same or a separate context):
#   VPC_ID, SUBNET_IDS, SOURCE_QUERY, PG_HOST, PG_PASSWORD
#   optional: PG_PORT PG_DATABASE PG_USER FLAG_THRESHOLD INFERENCE_BATCH_SIZE
#             MAX_DOWNLOAD_WORKERS WINDOW_SIZE IMAGENET_NORMALIZE TMP_EPHEMERAL_MB
#
# Prefer OIDC over long-lived keys? Replace the aws-cli/setup step with
# aws-cli/setup: { role_arn: $AWS_ROLE_ARN, region: $AWS_REGION } and drop the keys.
version: 2.1

orbs:
  aws-cli: circleci/aws-cli@5.4

parameters:
  aws_region:
    type: string
    default: us-east-2
  ecr_repository:
    type: string
    default: pod-pipeline
  stage:
    type: string
    default: stg
  stack_name:
    type: string
    default: pod-scoring-stg

executors:
  # Machine executor: the image build needs a real Docker daemon with buildx,
  # and torch/torchvision CPU wheels make this a heavy build.
  docker-builder:
    machine:
      image: ubuntu-2404:current
      # docker_layer_caching: true   # paid feature — big win on rebuild time
    resource_class: medium
    working_directory: ~/project

commands:
  set-build-env:
    description: Common build/deploy environment (image tag is the commit SHA).
    steps:
      - run:
          name: Export build environment
          command: |
            {
              echo 'export AWS_REGION="<< pipeline.parameters.aws_region >>"'
              echo 'export AWS_DEFAULT_REGION="<< pipeline.parameters.aws_region >>"'
              echo 'export ECR_REPOSITORY="<< pipeline.parameters.ecr_repository >>"'
              echo 'export STAGE="<< pipeline.parameters.stage >>"'
              echo "export IMAGE_TAG=\"${CIRCLE_SHA1:0:12}\""
              # Must match stack.yaml: FunctionName: !Sub pod-pipeline-${Stage}
              # (independent of the ECR repo name — do not derive it from that).
              echo "export LAMBDA_FUNCTION=\"pod-pipeline-<< pipeline.parameters.stage >>\""
            } >> "$BASH_ENV"
      - run:
          name: Verify the trained checkpoint is present
          command: |
            test -f aws/lambda_scorer/model/best.pt \
              || { echo "aws/lambda_scorer/model/best.pt missing — it is baked into the image"; exit 1; }
            ls -lh aws/lambda_scorer/model/best.pt

jobs:
  # Builds the exact image that ships, then runs the handler test suite inside it
  # so pytest sees the pinned torch/timm/cv2 stack instead of a CI-only install.
  build-and-test:
    executor: docker-builder
    steps:
      - checkout
      - set-build-env
      - run:
          name: Build image (DRY_RUN — no AWS calls)
          no_output_timeout: 30m
          command: |
            cd aws
            chmod +x deploy.sh provision-stack.sh
            DRY_RUN=true ./deploy.sh
      - run:
          name: pytest inside the built image
          command: |
            docker run --rm \
              -v "$PWD/aws/lambda_scorer:/work" -w /work \
              --entrypoint /bin/bash \
              "pod-pipeline-local:${IMAGE_TAG}" -c \
              "pip install --no-cache-dir -r requirements-dev.txt >/dev/null && python -m pytest -q --junitxml=/work/test-results/junit.xml"
      - store_test_results:
          path: aws/lambda_scorer/test-results
      - store_artifacts:
          path: aws/lambda_scorer/test-results

  # Rebuild (cheap-ish: same layers when DLC is on), push to ECR, roll the Lambda.
  deploy:
    executor: docker-builder
    steps:
      - checkout
      - set-build-env
      - aws-cli/setup:
          region: << pipeline.parameters.aws_region >>
      # Bootstrap: on a brand-new stage the Lambda does not exist yet (it is created
      # by provision-stack, which needs an image already in ECR). Push the image and
      # skip the function update in that case instead of failing with
      # ResourceNotFoundException — the next deploy rolls the function normally.
      - run:
          name: Does the Lambda exist yet?
          command: |
            if aws lambda get-function-configuration \
                 --function-name "${LAMBDA_FUNCTION}" --region "${AWS_REGION}" >/dev/null 2>&1; then
              echo "export SKIP_LAMBDA_UPDATE=false" >> "$BASH_ENV"
              echo "${LAMBDA_FUNCTION} exists — will update its code."
            else
              echo "export SKIP_LAMBDA_UPDATE=true" >> "$BASH_ENV"
              echo "${LAMBDA_FUNCTION} not found — image-only push (bootstrap)."
              echo "Approve the provision-stack job to create it from aws/infra/stack.yaml."
            fi
      - run:
          name: Build, push to ECR, update function code
          no_output_timeout: 30m
          command: |
            cd aws
            chmod +x deploy.sh
            ./deploy.sh
      - run:
          name: Also publish the :latest tag
          command: |
            ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
            REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
            docker tag "pod-pipeline-local:${IMAGE_TAG}" "${REGISTRY}/${ECR_REPOSITORY}:latest"
            docker push "${REGISTRY}/${ECR_REPOSITORY}:latest"
      - run:
          name: Wait for the function update and verify the image URI
          command: |
            if [ "${SKIP_LAMBDA_UPDATE}" = "true" ]; then
              echo "Bootstrap run — no function to verify. Image is in ECR at tag ${IMAGE_TAG}."
              exit 0
            fi
            aws lambda wait function-updated \
              --function-name "${LAMBDA_FUNCTION}" --region "${AWS_REGION}"
            LIVE="$(aws lambda get-function-configuration \
              --function-name "${LAMBDA_FUNCTION}" --region "${AWS_REGION}" \
              --query 'ImageUri' --output text)"
            echo "live image: ${LIVE}"
            case "${LIVE}" in
              *":${IMAGE_TAG}") echo "OK — function is on ${IMAGE_TAG}" ;;
              *) echo "MISMATCH — expected tag ${IMAGE_TAG}"; exit 1 ;;
            esac
      # Not invoking the function here on purpose: the empty {} payload is a full
      # day's scoring run. Smoke-test manually per aws/DEPLOYMENT.md when needed.

  # Infra changes only (stack.yaml / operating knobs). Manual-approval gated.
  provision-stack:
    executor: docker-builder
    steps:
      - checkout
      - set-build-env
      - aws-cli/setup:
          region: << pipeline.parameters.aws_region >>
      - run:
          name: aws cloudformation deploy
          command: |
            cd aws
            chmod +x provision-stack.sh
            ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
            export STACK_NAME="<< pipeline.parameters.stack_name >>"
            export SCORER_IMAGE_URI="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${IMAGE_TAG}"
            ./provision-stack.sh

workflows:
  build-test-deploy:
    jobs:
      - build-and-test

      - hold-deploy:
          type: approval
          requires: [build-and-test]
          filters:
            branches:
              only: [main, circleci-project-setup]

      - deploy:
          context: [pod-verifier-aws]
          requires: [hold-deploy]
          filters:
            branches:
              only: [main, circleci-project-setup]

      # Run only when infra/stack.yaml changed; approve after the image is pushed
      # so SCORER_IMAGE_URI points at a tag that exists in ECR.
      - hold-provision:
          type: approval
          requires: [deploy]
          filters:
            branches:
              only: [main, circleci-project-setup]

      - provision-stack:
          context: [pod-verifier-aws]
          requires: [hold-provision]
          filters:
            branches:
              only: [main, circleci-project-setup]
