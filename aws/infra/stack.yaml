AWSTemplateFormatVersion: "2010-09-09"
Description: >
  POD pipeline — VPC Lambda (container image) triggered once daily by EventBridge
  Scheduler. Single invocation: read POD rows from Postgres, download images to
  memory, score with EfficientNet, upsert to Postgres; resume + bounded
  self-continuation. No SAM. Deploy with aws/provision-stack.sh.

Parameters:
  Stage:
    Type: String
    Default: stg
    AllowedValues: [dev, stg, prod]

  SourceQuery:
    Type: String
    Description: >
      SQL run against Postgres to read the day's POD rows. Must return an AWB
      column, a trip-id column, and a POD-links column (POD / pod / pod_link;
      comma-separated links are expanded).

  FlagThreshold:
    Type: String
    Default: "0.7"

  InferenceBatchSize:
    Type: String
    Default: "64"

  MaxDownloadWorkers:
    Type: String
    Default: "64"
    Description: Concurrent image download threads (tune vs source host 429s / NAT)

  WindowSize:
    Type: String
    Default: "800"
    Description: Images held in memory per window (bounds peak memory)

  ImagenetNormalize:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Apply ImageNet mean/std at inference (must match training preprocessing)

  PgHost:
    Type: String
    Description: PostgreSQL endpoint (source query + results both run here)

  PgPort:
    Type: String
    Default: "5432"

  PgDatabase:
    Type: String
    Default: pod_classifier

  PgUser:
    Type: String
    Default: postgres

  PgPassword:
    Type: String
    NoEcho: true

  VpcId:
    Type: AWS::EC2::VPC::Id

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>

  ScorerImageUri:
    Type: String
    Description: Full ECR image URI tag for the Lambda container

  TmpEphemeralMB:
    Type: Number
    Default: 512

Resources:

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: POD pipeline Lambda egress
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub pod-pipeline-fn-${Stage}
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
      Policies:
        - PolicyName: SelfInvokeMetricsAndDLQ
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow           # bounded self-continuation
                Action: lambda:InvokeFunction
                Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:pod-pipeline-${Stage}
              - Effect: Allow           # coverage metrics
                Action: cloudwatch:PutMetricData
                Resource: "*"
              - Effect: Allow           # dead-letter for exhausted async retries
                Action: sqs:SendMessage
                Resource: !GetAtt PipelineDLQ.Arn

  PodPipelineFunction:
    Type: AWS::Lambda::Function
    DependsOn:
      - LambdaExecutionRole
    Properties:
      FunctionName: !Sub pod-pipeline-${Stage}
      PackageType: Image
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        ImageUri: !Ref ScorerImageUri
      MemorySize: 10240          # ~6 vCPU — CPU is bought with memory
      Timeout: 900
      ReservedConcurrentExecutions: 3   # daily run + retry/continuation headroom
      DeadLetterConfig:
        TargetArn: !GetAtt PipelineDLQ.Arn
      EphemeralStorage:
        Size: !Ref TmpEphemeralMB   # in-memory design uses no /tmp; keep small
      Architectures:
        - x86_64
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds: !Ref SubnetIds
      Environment:
        Variables:
          SOURCE_QUERY: !Ref SourceQuery
          FLAG_THRESHOLD: !Ref FlagThreshold
          MAX_DOWNLOAD_WORKERS: !Ref MaxDownloadWorkers
          WINDOW_SIZE: !Ref WindowSize
          INFERENCE_BATCH_SIZE: !Ref InferenceBatchSize
          IMAGENET_NORMALIZE: !Ref ImagenetNormalize
          CONTINUATION_SAFETY_MS: "90000"
          MAX_CONTINUATIONS: "5"
          PG_HOST: !Ref PgHost
          PG_PORT: !Ref PgPort
          PG_DATABASE: !Ref PgDatabase
          PG_USER: !Ref PgUser
          PG_PASSWORD: !Ref PgPassword
          MODEL_PATH: /opt/model/best.pt
          INPUT_SIZE: "224"

  # Async retries: a timeout counts as a failure → AWS re-invokes; the resume
  # checkpoint makes each retry advance. Exhausted retries land in the DLQ.
  PodPipelineEventInvokeConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref PodPipelineFunction
      Qualifier: "$LATEST"
      MaximumRetryAttempts: 2
      MaximumEventAgeInSeconds: 3600

  PipelineDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub pod-pipeline-dlq-${Stage}
      MessageRetentionPeriod: 1209600   # 14 days

  SchedulerInvokeLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref PodPipelineFunction
      Action: lambda:InvokeFunction
      Principal: scheduler.amazonaws.com

  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub pod-pipeline-scheduler-${Stage}
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokePodPipeline
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt PodPipelineFunction.Arn

  DailySchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub pod-scoring-daily-${Stage}
      Description: Trigger POD pipeline (single invocation, whole dataset) 23:55 IST (18:25 UTC)
      ScheduleExpression: cron(25 18 * * ? *)
      ScheduleExpressionTimezone: UTC
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: !GetAtt PodPipelineFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{}'
        RetryPolicy:
          MaximumRetryAttempts: 2
          MaximumEventAgeInSeconds: 3600

Outputs:
  PodPipelineFunctionArn:
    Value: !GetAtt PodPipelineFunction.Arn
  PodPipelineFunctionName:
    Value: !Ref PodPipelineFunction
  ScheduleName:
    Value: !Ref DailySchedule
  ScheduleArn:
    Value: !GetAtt DailySchedule.Arn
